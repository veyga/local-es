x-client-env: &client-env
  CTX: local
  LOG_LEVEL: DEBUG
  PYDEVD_DISABLE_FILE_VALIDATION: 1
  ES_HOST: "https://host.docker.internal:9200"
  ES_CA_CERT: "/output/es-ca.crt"
  ES_PASSWORD_FILE: "/output/es-password"

services:
  kind:
    network_mode: host
    build:
      context: .
      dockerfile: local/k8s/Dockerfile.kind
      args:
        KIND_CLUSTER_NAME: "locales"
        KIND_VERSION: "0.30.0"
        KUBECTL_VERSION: "1.34.2"
        HELM_VERSION: "4.0.1"
        TERRAFORM_VERSION: "1.12.1"
    privileged: true # needed for dind: cgroups, etc
    environment:
      KIND_CLUSTER_NAME: locales
      ELASTIC_NAMESPACE: "elastic"
      ES_VERSION: "9.2.4"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./generated:/output
      - ./local/bin:/local/bin
      - ./local/tf:/local/tf
      - ./generated:/generated
      - kind_cluster_data:/var/lib/docker
    command: ["/local/bin/run.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "/local/bin/healthcheck-kind.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  client:
    build:
      context: client
      dockerfile: Dockerfile
      args:
        IS_LOCAL: "true"
    ports:
      - 8443:8443
      # debugging ports
      - 5678:5678
      - 5679:5679
    volumes:
      - ./client:/app
      - ./generated:/output
    environment:
      <<: *client-env
    networks:
      - shared # uses this to simulate external access
    command: >-
      python
      -m
      debugpy
      --listen
      0.0.0.0:5678
      -m
      uvicorn
      src.main:app
      --reload
      --port=8443
      --host=0.0.0.0
      --log-config=logconfig
    depends_on:
      kind:
        condition: service_healthy

volumes:
  kind_cluster_data:
    name: locales_kind_cluster_data

networks:
  shared:
    driver: bridge
