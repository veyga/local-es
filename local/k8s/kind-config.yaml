kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: locales
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - "host.docker.internal"
            - "localhost"
            - "127.0.0.1"
            - "0.0.0.0"
            - "locales-control-plane"
    extraPortMappings:
      - containerPort: 30920
        hostPort: 9200
        protocol: TCP
